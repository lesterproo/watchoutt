[package]
name = "watchoutt"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "watchouttt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
watchouttt-core = { path = "../../watchouttt-core" }
once_cell = "1.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
